[package]
name = "super-trek"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Super Trek: the 1970s Super Star Trek, ported from ESR's SST2K for the Asciiverse catalog"
license-file = "NOTICE"
publish = false

[[bin]]
name = "super-trek"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a thawed game must hold the exact floats it saved
serde_json = { version = "1", features = ["float_roundtrip"] }
ratatui = "0.30"

[profile.release]
opt-level = 3
